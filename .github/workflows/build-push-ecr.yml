name: build docker image

on: 
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      aws_region:
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: true
    outputs:
      image_digest:
        description: Docker image digest
        value: ${{ jobs.build.outputs.image_digest }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Debug GitHub context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref:        $GITHUB_REF"
          echo "Event:      $GITHUB_EVENT_NAME"
          echo "Workflow:   $GITHUB_WORKFLOW"
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Fetch and Decode GitHub OIDC Token Claims
        run: |
          # 1. Request the raw OIDC token using GitHub's dynamic runner environment variables
          JWT_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=://amazonaws.com" | jq -r '.value')
          
          echo "========================================="
          echo "           DECODED OIDC CLAIMS           "
          echo "========================================="
          
          # 2. Extract the payload section (second block of the JWT), decode from base64, and format with jq
          echo "$JWT_TOKEN" | cut -d'.' -f2 | base64 --decode 2>/dev/null | jq '{iss, aud, sub, repository, repository_owner, ref}'
          
          echo "========================================="
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.image_name }}:${{ inputs.image_tag }}
  